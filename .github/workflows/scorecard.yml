name: OpenSSF Scorecard

# Supply-chain security score of the repository (https://scorecard.dev). The
# result is published to the OpenSSF API (publish_results) and uploaded to the
# Security tab. Permissions as in the README of ossf/scorecard-action.

on:
  push:
    branches:
      - main
  schedule:
    # Weekly, Tuesday 03:41 UTC
    - cron: "41 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write # upload the SARIF file
      id-token: write # publish the result (publish_results: true)

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload the result as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
