name: Publish APT repository

# Publishes the apt repository, the RPM repositories (under /rpm) and the pacman
# repository (under /arch) to GitHub Pages. The file keeps its name: build-release.yml and the docs call it.
#
# GitHub Releases are the source of truth: every run rebuilds the whole
# repositories from the .deb, .rpm and .pkg.tar.zst assets of all published releases, so the run is
# idempotent and the repository can be recreated from scratch at any time
# (after a key rotation, for example). Nothing is committed to the repo.
#
# Every package is verified before it is signed: the release's SHA256SUMS has
# a build provenance attestation (one gh attestation verify call per release)
# and the SHA256 of the package is the one in it. Only the releases of
# .github/legacy-unattested-releases.txt are exempt (today every published
# release is one of them).
#
# Called by build-release.yml after a tagged release, or manually.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  attestations: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # The build takes a few minutes, the Pages deploy up to 30 (its timeout below)
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install repository tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y dpkg-dev apt-utils createrepo-c rpm

      - name: Import signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$APT_GPG_PRIVATE_KEY" ]; then
            echo "::error::Secret APT_GPG_PRIVATE_KEY is not set - see docs/APT_REPO.md"
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          fingerprint=$(gpg --batch --with-colons --list-secret-keys \
            | awk -F: '/^fpr:/ {print $10; exit}')
          if [ -z "$fingerprint" ]; then
            echo "::error::No secret key found in APT_GPG_PRIVATE_KEY"
            exit 1
          fi
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "APT_GPG_KEY=$fingerprint" >> "$GITHUB_ENV"
          echo "Signing with $fingerprint"

      # Only real releases: isPrerelease == false is what keeps the pr-<N> test
      # builds (prereleases created by pr-test-packages.yml) out of the apt
      # repository. Keep that filter, and keep pr-<N> a prerelease.
      - name: Download packages from every published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p incoming verify
          # --paginate: no fixed limit, so an old release is never dropped from
          # the repository when there are many releases.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            -q '.[] | select(.draft == false and .prerelease == false) | .tag_name' > tags.txt
          if [ ! -s tags.txt ]; then
            echo "::error::No published releases to build the repository from"
            exit 1
          fi
          while read -r tag; do
            echo "::group::$tag"
            # Read the asset names once: a failing download must fail the job,
            # never drop a release from the repositories silently.
            assets="$(gh release view "$tag" --json assets -q '.assets[].name')"
            mkdir "verify/$tag"
            if grep -q '\.deb$' <<< "$assets"; then
              gh release download "$tag" -D "verify/$tag" --pattern '*.deb'
            else
              echo "::warning::$tag has no .deb assets"
            fi
            # Releases before the RPM packages have none
            if grep -q '\.rpm$' <<< "$assets"; then
              gh release download "$tag" -D "verify/$tag" --pattern '*.rpm'
            else
              echo "::warning::$tag has no .rpm assets"
            fi
            # Releases before the Arch Linux packages have none
            if grep -q '\.pkg\.tar\.zst$' <<< "$assets"; then
              gh release download "$tag" -D "verify/$tag" --pattern '*.pkg.tar.zst'
            else
              echo "::warning::$tag has no .pkg.tar.zst assets"
            fi
            # Releases after v1.5.0 have a SHA256SUMS asset; the legacy ones
            # (.github/legacy-unattested-releases.txt) do not.
            if grep -qx 'SHA256SUMS' <<< "$assets"; then
              gh release download "$tag" -D "verify/$tag" --pattern 'SHA256SUMS'
            fi
            # Attested SHA256SUMS and the checksum of every package: a failure
            # stops the run before anything is signed.
            bash .github/scripts/verify-release-assets.sh "$tag" "verify/$tag"
            find "verify/$tag" \( -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' \) -exec cp {} incoming/ \;
            echo "::endgroup::"
          done < tags.txt
          ls -la incoming

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build the repository
        env:
          APT_REPO_URL: ${{ steps.pages.outputs.base_url }}
        run: bash .github/scripts/build-apt-repo.sh incoming site "$APT_GPG_KEY"

      # After the apt repository: it writes the landing page, which gets the RPM
      # part here (or loses it when no release has RPMs). The signing key is
      # the one imported above, found through GNUPGHOME and never passed as an
      # argument.
      - name: Build the RPM repositories
        run: bash .github/scripts/build-rpm-repo.sh --index site/index.html --allow-empty incoming site/rpm "$APT_GPG_KEY"

      # After the RPM repositories, for the same reason: the landing page gets the
      # Arch Linux part here (or loses it when no release has Arch packages).
      # repo-add runs in an archlinux container, the signing key is the one imported above.
      - name: Build the pacman repository
        run: bash .github/scripts/build-arch-repo.sh --index site/index.html --allow-empty incoming site/arch "$APT_GPG_KEY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          # since v4 dotfiles are left out by default; the site has .nojekyll
          include-hidden-files: true

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          # The site (every release's packages, about 140 MB) can stay in
          # "syncing_files" longer than the default 10 minutes. A failed run
          # cannot be re-run (its github-pages artifact is there twice):
          # start a new run of this workflow instead.
          timeout: 1800000
