name: Publish APT repository

# Publishes the apt repository to GitHub Pages.
#
# GitHub Releases are the source of truth: every run rebuilds the whole
# repository from the .deb assets of all published releases, so the run is
# idempotent and the repository can be recreated from scratch at any time
# (after a key rotation, for example). Nothing is committed to the repo.
#
# Called by build-release.yml after a tagged release, or manually.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install repository tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y dpkg-dev apt-utils

      - name: Import signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$APT_GPG_PRIVATE_KEY" ]; then
            echo "::error::Secret APT_GPG_PRIVATE_KEY is not set - see docs/APT_REPO.md"
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p -m 700 "$GNUPGHOME"
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          fingerprint=$(gpg --batch --with-colons --list-secret-keys \
            | awk -F: '/^fpr:/ {print $10; exit}')
          if [ -z "$fingerprint" ]; then
            echo "::error::No secret key found in APT_GPG_PRIVATE_KEY"
            exit 1
          fi
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "APT_GPG_KEY=$fingerprint" >> "$GITHUB_ENV"
          echo "Signing with $fingerprint"

      - name: Download packages from every published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p incoming
          gh release list --limit 100 --json tagName,isDraft,isPrerelease \
            -q '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' > tags.txt
          if [ ! -s tags.txt ]; then
            echo "::error::No published releases to build the repository from"
            exit 1
          fi
          while read -r tag; do
            echo "::group::$tag"
            gh release download "$tag" -D incoming --pattern '*.deb' --clobber \
              || echo "::warning::$tag has no .deb assets"
            echo "::endgroup::"
          done < tags.txt
          ls -la incoming

      - name: Build the repository
        run: bash .github/scripts/build-apt-repo.sh incoming site "$APT_GPG_KEY"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4
