name: Build and Release

on:
  push:
    tags:
      - "v*"
  # Build every package on pull requests as a check. Nothing is released or
  # published: release and publish-apt run only for tags.
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      ubuntu_version:
        description: "Ubuntu version to build"
        required: true
        default: "24.04"
        type: choice
        options:
          - "22.04"
          - "24.04"
          - "26.04"
          - "all"
      # RPM packages: independent of the choice above, which only picks the Ubuntu build
      rpm_target:
        description: "RPM target to build (none: no RPM build)"
        required: true
        default: "none"
        type: choice
        options:
          - "none"
          - "fedora43"
          - "fedora44"
          - "fedora45"
          - "el10"
          - "leap16.0"
          - "leap16.1"
          - "tumbleweed"
          - "all"
      # Arch Linux packages (x86_64 only): a manual run builds them only when asked
      arch_linux:
        description: "Build the Arch Linux packages"
        required: true
        default: false
        type: boolean

# Read-only by default (pull requests run the build); only the release job
# gets write access.
permissions:
  contents: read

# A new push to a pull request cancels the superseded build. Tag, manual and
# main runs are never cancelled: a release must run to the end. GitHub keeps
# one pending run per group and drops the older one even without
# cancel-in-progress, so those runs get their own group.
concurrency:
  group: build-release-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A release tag must be v<upstream version of debian/changelog>: otherwise
  # the packages would carry another version than the release's name.
  check-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            debian/changelog
          sparse-checkout-cone-mode: false

      - name: Check the tag against debian/changelog
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          TAG: ${{ github.ref_name }}
        run: |
          # Only a tag push is a release; other runs have no tag to check
          if [ "$EVENT_NAME" = "push" ] && [[ "$REF" == refs/tags/* ]]; then
            python3 .github/scripts/check_tag_version.py "$TAG" debian/changelog
          fi

  build:
    needs: check-tag
    # Docker builds natively on each runner (no QEMU): the arm64 runner produces
    # arm64 packages, the amd64 one amd64 packages.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    # Only this job, build-rpm and build-arch write attestations (build provenance of the
    # package files); everything else stays read-only.
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        # Only a manual run can pick one version; tags and pull requests build all.
        ubuntu: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.ubuntu_version == 'all' && fromJSON('["22.04", "24.04", "26.04"]') || fromJSON(format('["{0}"]', github.event.inputs.ubuntu_version))) || fromJSON('["22.04", "24.04", "26.04"]') }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Vendor the crates
        # The package build needs no network: the crates are in vendor/ (cargo vendor
        # of Cargo.lock) and cargo runs --offline (debian/rules, rpm spec)
        run: |
          cargo --version
          bash scripts/vendor-crates.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Debian packages
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -e

          # A pull request's packages get a version above the release's one
          # (1.4.2-1~noble1+pr24.57 sorts after 1.4.2-1~noble1), or installing
          # them over the released version would be a no-op for apt. Only
          # numbers go into it, checked here.
          pr_suffix=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,6}$ && "$RUN_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]]; then
              echo "ERROR: unexpected pull request or run number: '$PR_NUMBER' '$RUN_NUMBER'"
              exit 1
            fi
            pr_suffix="+pr${PR_NUMBER}.${RUN_NUMBER}"
          fi

          ubuntu="${{ matrix.ubuntu }}"
          arch="${{ matrix.arch }}"
          out="output/ubuntu${ubuntu}-${arch}"

          # Create output directory with write permissions for all users
          mkdir -p "$out"
          chmod 777 "$out"

          # build_packages <image name> <Dockerfile> <control file> [docker build
          # arguments]: build the image, then the packages in it. A fresh
          # container per build: only its own .deb files are in /build and get
          # copied to the output directory (fail on error).
          build_packages() {
            local name="$1" dockerfile="$2" control="$3"
            shift 3
            echo "Building $name from $dockerfile and $control"
            docker build "$@" -t "gpclient-builder:$name" -f "$dockerfile" .

            # WORKDIR is /build/source, so ".." = /build where dpkg-buildpackage writes .deb files
            # --network none: the crates are vendored, the build must not need the network
            docker run --rm --network none -e PR_SUFFIX="$pr_suffix" -e CONTROL="$control" \
              -v "${{ github.workspace }}/$out:/output" \
              -v "${{ github.workspace }}/vendor:/build/source/vendor:ro" \
              "gpclient-builder:$name" \
              bash -c '
                set -e
                cp "$CONTROL" debian/control
                # Tag the version with the release codename (1.4.0-1~noble1) so the
                # same version never means different binaries and apt sees a reason
                # to reinstall after a distribution upgrade. The apt repository
                # derives the suite from this suffix (.github/scripts/build-apt-repo.sh).
                # Pull requests add +pr<PR>.<run> (PR_SUFFIX, empty otherwise).
                . /etc/os-release
                sed -i "1s/(\([^)]*\))/(\1~${VERSION_CODENAME}1${PR_SUFFIX})/" debian/changelog
                echo "Building version $(dpkg-parsechangelog -S Version) for $VERSION_CODENAME"
                dpkg-buildpackage -us -uc -b
                # Fail the build on a lintian error (warnings only get printed).
                # Intentional errors go into debian/lintian-overrides files, each with a comment.
                lintian --fail-on error --display-info /build/*.deb
                cp /build/*.deb /build/*.ddeb /output/ 2>/dev/null || cp /build/*.deb /output/
              '
          }

          # variant_arches <control file>: the architectures its binary packages
          # are built for (their Architecture fields), one word per line. A
          # variant is Dockerfile.ubuntu<version>-<variant> together with
          # debian/control.ubuntu<version>-<variant>: it builds more packages of
          # the same release into the same directory, after the main build.
          # "any" is every architecture; KDE neon (Ubuntu 24.04 with Plasma 6)
          # says "amd64" there, because plasma-nm, which the plugin is linked
          # against, is not in its arm64 repository.
          variant_arches() {
            awk '
              /^[ \t]*$/ { binary = 0 }
              tolower($1) == "package:" { binary = 1 }
              binary && tolower($1) == "architecture:" { for (i = 2; i <= NF; i++) print $i }
            ' "$1"
          }

          # One Dockerfile.ubuntu for every release; it installs the build dependencies
          # of debian/control.ubuntu<version>.
          build_packages "ubuntu$ubuntu" "Dockerfile.ubuntu" "debian/control.ubuntu$ubuntu" --build-arg "UBUNTU=$ubuntu"

          mapfile -t variants < <(for file in Dockerfile.ubuntu${ubuntu}-* debian/control.ubuntu${ubuntu}-*; do
            [ -e "$file" ] && echo "${file##*ubuntu${ubuntu}-}"
          done | sort -u)
          for variant in "${variants[@]}"; do
            if ! [[ "$variant" =~ ^[a-z0-9]+$ ]]; then
              echo "::error::unexpected name of a build variant: '$variant'"
              exit 1
            fi
            dockerfile="Dockerfile.ubuntu${ubuntu}-${variant}"
            control="debian/control.ubuntu${ubuntu}-${variant}"
            if ! [ -f "$dockerfile" ] || ! [ -f "$control" ]; then
              echo "::warning::variant $variant of Ubuntu $ubuntu needs both $dockerfile and $control: not built"
              continue
            fi
            arches=$(variant_arches "$control" | sort -u | tr '\n' ' ')
            if [ -z "${arches// /}" ]; then
              echo "::error::variant $variant has no Architecture field in its binary packages in $control"
              exit 1
            fi
            case " $arches " in
              *" any "* | *" $arch "*) build_packages "ubuntu${ubuntu}-${variant}" "$dockerfile" "$control" ;;
              *) echo "Variant $variant is built for ${arches% } only, not for $arch" ;;
            esac
          done

      - name: Verify .deb files exist
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if ! ls output/ubuntu${{ matrix.ubuntu }}-${{ matrix.arch }}/*.deb 1>/dev/null 2>&1; then
            echo "ERROR: No .deb files produced!"
            exit 1
          fi
          # A wrong-architecture .deb would land in the wrong apt Packages index
          for deb in output/ubuntu${{ matrix.ubuntu }}-${{ matrix.arch }}/*.deb; do
            deb_arch=$(dpkg-deb -f "$deb" Architecture)
            if [ "$deb_arch" != "${{ matrix.arch }}" ]; then
              echo "ERROR: $deb has Architecture '$deb_arch', expected '${{ matrix.arch }}'"
              exit 1
            fi
          done
          # The version ends in ~<codename>1 (build-apt-repo.sh reads the suite
          # from it), for a pull request followed by +pr<PR>.<run> (what
          # scripts/install-pr-build.sh expects), and never on a release build
          if [ "$EVENT_NAME" = "pull_request" ]; then
            version_re="~[a-z]+1[+]pr${PR_NUMBER}[.]${RUN_NUMBER}$"
          else
            version_re='~[a-z]+1$'
          fi
          for deb in output/ubuntu${{ matrix.ubuntu }}-${{ matrix.arch }}/*.deb; do
            deb_version=$(dpkg-deb -f "$deb" Version)
            if ! [[ "$deb_version" =~ $version_re ]]; then
              echo "ERROR: $deb has version '$deb_version', expected it to match '$version_re'"
              exit 1
            fi
          done
          echo "Built packages:"
          ls -la output/ubuntu${{ matrix.ubuntu }}-${{ matrix.arch }}/*.deb

      - name: Attest build provenance of the .deb files
        # Tags and pull requests of this repository: a pull request from a
        # fork (and Dependabot) gets a read-only token and cannot attest. The
        # apt repository publishes only packages with provenance
        # (.github/scripts/verify-release-assets.sh).
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: output/ubuntu${{ matrix.ubuntu }}-${{ matrix.arch }}/*.deb

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debs-ubuntu-${{ matrix.ubuntu }}-${{ matrix.arch }}
          path: output/ubuntu${{ matrix.ubuntu }}-${{ matrix.arch }}/*.deb

      - name: Upgrade test from the last release
        # Not for tags (the only push trigger): a network flake in a check must
        # not block a release. Installs the newest release from the public apt
        # repository in a fresh ubuntu container and upgrades it to the
        # packages built above (see
        # .github/scripts/upgrade-test.sh). Every scenario runs; the step fails
        # at the end if any of them failed. The neon scenario (KDE neon, the
        # Ubuntu 24.04 variant with Plasma 6) skips itself where no such
        # package was built. The containers write the GUI smoke test
        # screenshots to gui-smoke/, uploaded by the next step.
        if: github.event_name != 'push'
        env:
          UBUNTU: ${{ matrix.ubuntu }}
          ARCH: ${{ matrix.arch }}
        run: |
          failed=""
          mkdir -p "$PWD/gui-smoke"
          for scenario in gnome plasma neon; do
            echo "::group::Upgrade test: $scenario"
            if ! docker run --rm \
                -v "$PWD/output/ubuntu${UBUNTU}-${ARCH}:/debs:ro" \
                -v "$PWD/.github/scripts:/scripts:ro" \
                -v "$PWD/gui-smoke:/out" \
                "ubuntu:${UBUNTU}" bash /scripts/upgrade-test.sh "$scenario" /debs /out; then
              failed="$failed $scenario"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Upgrade test failed for:$failed"
            exit 1
          fi

      - name: Upload GUI screenshots
        # Screenshots of the connection editor from the upgrade test (see
        # .github/scripts/gui-smoke.sh); also kept when that test failed. Not
        # for tags, like the test.
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-smoke-ubuntu-${{ matrix.ubuntu }}-${{ matrix.arch }}
          path: gui-smoke/*.png
          if-no-files-found: ignore

  # RPM packages: one build per target of rpm/targets and architecture, each in
  # a fresh container of the target's distribution (rpm/build.sh), then
  # installed in another one (rpm/install-test.sh). The target list is
  # rpm/targets; a unit test keeps this matrix equal to it. A manual run builds
  # the target it picks (none: no RPM build, and so no release job either).
  build-rpm:
    needs: check-tag
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.rpm_target != 'none'
    # Natively on each runner, like the Ubuntu build: the arm64 runner builds aarch64 packages.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        target: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.rpm_target == 'all' && fromJSON('["fedora43", "fedora44", "fedora45", "el10", "leap16.0", "leap16.1", "tumbleweed"]') || fromJSON(format('["{0}"]', github.event.inputs.rpm_target))) || fromJSON('["fedora43", "fedora44", "fedora45", "el10", "leap16.0", "leap16.1", "tumbleweed"]') }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Vendor the crates
        # The package build needs no network: the crates are in vendor/ (cargo vendor
        # of Cargo.lock) and cargo runs --offline (debian/rules, rpm spec)
        run: |
          cargo --version
          bash scripts/vendor-crates.sh

      - name: Build RPM packages
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_NUMBER: ${{ github.run_number }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -e

          # A pull request's packages get the release <revision><dist>.pr<PR>.<run>
          # (1.fc44.pr24.57 sorts after 1.fc44), like the debs' +pr<PR>.<run>. Only
          # numbers go into it, checked here and again by rpm/build.sh. Other builds
          # have neither number.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,6}$ && "$RUN_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]]; then
              echo "ERROR: unexpected pull request or run number: '$PR_NUMBER' '$RUN_NUMBER'"
              exit 1
            fi
            export PR_NUMBER RUN_NUMBER
          else
            unset PR_NUMBER RUN_NUMBER
          fi

          bash rpm/build.sh "$TARGET" "$ARCH" "output/${TARGET}-${ARCH}"

      - name: Verify .rpm files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_NUMBER: ${{ github.run_number }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -e
          out="output/${TARGET}-${ARCH}"

          # The dist tag of the target (rpm/targets) and the architecture the
          # RPMs are named with
          dist=$(awk -v target="$TARGET" '!/^[ \t]*#/ && $1 == target { print $3 }' rpm/targets)
          if [ -z "$dist" ]; then
            echo "ERROR: target '$TARGET' is not in rpm/targets"
            exit 1
          fi
          case "$ARCH" in
            amd64) rpm_arch=x86_64 ;;
            arm64) rpm_arch=aarch64 ;;
            *) echo "ERROR: unexpected architecture '$ARCH'"; exit 1 ;;
          esac

          # <package>-<version>-<revision><dist>[.pr<PR>.<run>].<arch>.rpm, for
          # a pull request with its own numbers (what scripts/install-pr-build.sh
          # expects), and never on a release build
          if [ "$EVENT_NAME" = "pull_request" ]; then
            suffix_re="[.]pr${PR_NUMBER}[.]${RUN_NUMBER}"
          else
            suffix_re=""
          fi
          name_re="^(network-manager-gpclient(-gnome|-plasma)?)-[0-9][A-Za-z0-9.+~_]*-[0-9]+${dist//./[.]}${suffix_re}[.]${rpm_arch}[.]rpm$"

          shopt -s nullglob
          files=("$out"/*)
          if [ "${#files[@]}" -ne 3 ]; then
            echo "ERROR: expected exactly 3 files in $out, found ${#files[@]}:"
            ls -la "$out"
            exit 1
          fi
          seen=""
          for file in "${files[@]}"; do
            base=$(basename "$file")
            if ! [[ "$base" =~ $name_re ]]; then
              echo "ERROR: $base does not match the expected name '$name_re'"
              exit 1
            fi
            seen="$seen ${BASH_REMATCH[1]}"
          done
          expected="network-manager-gpclient network-manager-gpclient-gnome network-manager-gpclient-plasma"
          if [ "$(printf '%s\n' $seen | sort | tr '\n' ' ')" != "$expected " ]; then
            echo "ERROR: expected the packages '$expected', found '${seen# }'"
            exit 1
          fi
          echo "Built packages:"
          ls -la "$out"

      - name: Attest build provenance of the .rpm files
        # Same condition as for the .deb files
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: output/${{ matrix.target }}-${{ matrix.arch }}/*.rpm

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpms-${{ matrix.target }}-${{ matrix.arch }}
          path: output/${{ matrix.target }}-${{ matrix.arch }}/*.rpm

      - name: Install test
        # Not for tags (the only push trigger), like the Ubuntu upgrade test: a
        # network flake in a check must not block a release. Installs the
        # packages built above in a fresh container of the target's image and
        # checks them (rpm/install-test.sh).
        if: github.event_name != 'push'
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          image=$(awk -v target="$TARGET" '!/^[ \t]*#/ && $1 == target { print $2 }' rpm/targets)
          if [ -z "$image" ]; then
            echo "::error::target '$TARGET' is not in rpm/targets"
            exit 1
          fi
          docker run --rm --platform "linux/${ARCH}" \
            -v "$PWD/output/${TARGET}-${ARCH}:/rpms:ro" \
            -v "$PWD/rpm:/rpm:ro" \
            "$image" bash /rpm/install-test.sh /rpms

  # Arch Linux packages (x86_64 only: official Arch Linux has no arm64): built in
  # a fresh archlinux container (arch/build.sh), then installed in another one
  # (arch/install-test.sh). A manual run builds them only with the input arch_linux.
  build-arch:
    needs: check-tag
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.arch_linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Vendor the crates
        # The package build needs no network for cargo: the crates are in vendor/
        # (cargo vendor of Cargo.lock) and cargo runs --offline (arch/PKGBUILD)
        run: |
          cargo --version
          bash scripts/vendor-crates.sh

      - name: Build Arch Linux packages
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -e

          # A pull request's packages get the version <version>.pr<PR>.<run>
          # (1.5.0.pr24.57-1 sorts after the release 1.5.0-1 and after every
          # earlier release, like the debs' and RPMs' markers). Only numbers go into it, checked here and again by
          # arch/build.sh. Other builds have neither number.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,6}$ && "$RUN_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]]; then
              echo "ERROR: unexpected pull request or run number: '$PR_NUMBER' '$RUN_NUMBER'"
              exit 1
            fi
            export PR_NUMBER RUN_NUMBER
          else
            unset PR_NUMBER RUN_NUMBER
          fi

          bash arch/build.sh output/arch-x86_64

      - name: Verify .pkg.tar.zst files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -e
          out=output/arch-x86_64

          # <package>-<version>[.pr<PR>.<run>]-<pkgrel>-x86_64.pkg.tar.zst, for a
          # pull request with its own numbers (what scripts/install-pr-build.sh
          # expects), and never on a release build
          if [ "$EVENT_NAME" = "pull_request" ]; then
            suffix_re="[.]pr${PR_NUMBER}[.]${RUN_NUMBER}"
          else
            suffix_re=""
          fi
          name_re="^(network-manager-gpclient(-gnome|-plasma)?)-[0-9][A-Za-z0-9._+]*${suffix_re}-[0-9]+-x86_64[.]pkg[.]tar[.]zst$"

          shopt -s nullglob
          files=("$out"/*)
          if [ "${#files[@]}" -ne 3 ]; then
            echo "ERROR: expected exactly 3 files in $out, found ${#files[@]}:"
            ls -la "$out"
            exit 1
          fi
          seen=""
          for file in "${files[@]}"; do
            base=$(basename "$file")
            if ! [[ "$base" =~ $name_re ]]; then
              echo "ERROR: $base does not match the expected name '$name_re'"
              exit 1
            fi
            seen="$seen ${BASH_REMATCH[1]}"
            # A release build must have no pull request marker
            if [ -z "$suffix_re" ] && [[ "$base" =~ [.]pr[0-9]+[.][0-9]+-[0-9]+-x86_64 ]]; then
              echo "ERROR: $base has a pull request marker, but this is not a pull request build"
              exit 1
            fi
          done
          expected="network-manager-gpclient network-manager-gpclient-gnome network-manager-gpclient-plasma"
          if [ "$(printf '%s\n' $seen | sort | tr '\n' ' ')" != "$expected " ]; then
            echo "ERROR: expected the packages '$expected', found '${seen# }'"
            exit 1
          fi
          echo "Built packages:"
          ls -la "$out"

      - name: Attest build provenance of the .pkg.tar.zst files
        # Same condition as for the .deb files
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: output/arch-x86_64/*.pkg.tar.zst

      - name: Upload Arch Linux artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-x86_64
          path: output/arch-x86_64/*.pkg.tar.zst

      - name: Install test of the Arch Linux packages
        # Not for tags (the only push trigger), like the RPM install test: a
        # network flake in a check must not block a release. Installs the
        # packages built above in a fresh archlinux container and checks them
        # (arch/install-test.sh).
        if: github.event_name != 'push'
        run: |
          bash arch/build.sh --install-test output/arch-x86_64

  # One CycloneDX SBOM of the Rust dependencies that gpclient and gpauth are
  # built from (the same Cargo.lock for every package), once per release. It is
  # made from the lock file: no build and no network. It is not in SHA256SUMS:
  # that file lists the package assets, which publish-apt checks one by one.
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only Cargo.lock is read: the nested submodules are not needed
          submodules: true
          persist-credentials: false

      - name: Generate SBOM of the Rust dependencies
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: external/GlobalProtect-openconnect/Cargo.lock
          syft-version: v1.55.0
          format: cyclonedx-json
          output-file: sbom-rust.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom-rust.cdx.json
          if-no-files-found: error

  release:
    needs: [build, build-rpm, build-arch, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Collect release files
        run: |
          # Filenames already carry the release codename in the version
          # and the architecture (network-manager-gpclient_1.4.0-1~noble1_amd64.deb),
          # the RPMs carry the dist tag and the architecture
          # (network-manager-gpclient-1.4.0-1.fc44.x86_64.rpm), the Arch Linux
          # packages the architecture (network-manager-gpclient-1.4.0-1-x86_64.pkg.tar.zst),
          # so no renaming is needed to keep them unique across all builds.
          mkdir -p release-files
          find artifacts \( -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' -o -name 'sbom-rust.cdx.json' \) -exec cp {} release-files/ \;
          echo "Release files:"
          ls -la release-files/

      - name: Write SHA256SUMS
        run: |
          # One line per package, named as GitHub stores the asset: it turns
          # the "~" of a version into "." (so `sha256sum -c SHA256SUMS` works in
          # the download directory). publish-apt checks every package against it.
          cd release-files
          sha256sum -- *.deb *.rpm *.pkg.tar.zst > SHA256SUMS
          sed -i 's/~/./g' SHA256SUMS
          cat SHA256SUMS

      # SHA256SUMS binds the hash of every package to this workflow and tag:
      # publish-apt verifies this one attestation per release, then the hashes.
      - name: Attest build provenance of SHA256SUMS
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-files/SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release-files/*.deb
            release-files/*.rpm
            release-files/*.pkg.tar.zst
            release-files/SHA256SUMS
            release-files/sbom-rust.cdx.json
          generate_release_notes: true
          fail_on_unmatched_files: true

  # Separate from "release" and not a dependency of publish-apt: a failure here
  # (the notes are only a convenience) never blocks the apt repository.
  release-notes:
    needs: release
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: true

      - name: Add downloads table to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # Merged between markers: a rerun replaces only the table and keeps the
          # generated notes and the edits made before this job runs.
          gh release view "$TAG" --repo "$REPO" --json assets,body > release.json
          python3 .github/scripts/release_notes.py --repo "$REPO" --tag "$TAG" --release-json release.json > new-body.md
          gh release edit "$TAG" --repo "$REPO" --notes-file new-body.md

  publish-apt:
    needs: release
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    permissions:
      contents: read
      attestations: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-apt.yml
    secrets: inherit
