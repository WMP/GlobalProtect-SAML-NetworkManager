name: Upstream contract

# Checks the pinned upstream (external/GlobalProtect-openconnect) against
# upstream/contract.json and upstream/features.json, and makes a change
# that the upstream changelog calls breaking wait for a human verification.
# Contract drift alone does not: it only fails the tests. See docs/UPSTREAM.md.
#
# `labeled` and `unlabeled` re-run the check, so adding the label
# `upstream-verified` turns the check green without a new push.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Only a new push to a pull request cancels the superseded run: see tests.yml.
concurrency:
  group: upstream-contract-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  upstream:
    name: Upstream contract
    runs-on: ubuntu-latest

    steps:
      # The top-level submodule only: the checks read upstream sources, they
      # build nothing, so the nested submodules are not needed.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      # The pin is a release tag: the tests check that the tag resolves to the
      # commit that is checked out. The tag is read from the contract. The legacy
      # untagged pin has no tag (null): there is nothing to fetch.
      - name: Fetch the pinned upstream tag
        run: |
          TAG=$(python3 -c 'import json; print(json.load(open("upstream/contract.json"))["tag"] or "")')
          if [ -n "$TAG" ]; then
            git -C external/GlobalProtect-openconnect fetch --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
          else
            echo "The contract pins an untagged commit: no tag to fetch"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Check the pinned upstream
        run: python -m pytest tests/upstream -q -p no:cacheprovider

      # The gate compares with the contract of the base branch, not with the one
      # of the pull request: a pull request cannot hide a breaking change by
      # editing its own contract (the base version is the starting point). The
      # gate logic (BREAKING_WORDS, the label check) also comes from the base
      # branch: a pull request cannot weaken it by editing
      # scripts/upstream_contract.py. Only the first pull request that adds the
      # script uses its own copy. The workflow file itself comes from the pull
      # request (pull_request trigger), so a change to it is visible in the
      # review. The script runs isolated (python -I) with explicit paths: it
      # imports nothing from its own directory. The label list is passed through
      # the environment, never into the script text.
      - name: Gate breaking upstream changes
        if: always() && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          BASE="$RUNNER_TEMP/base-contract.json"
          if git show FETCH_HEAD:upstream/contract.json > "$BASE" 2>/dev/null; then
            echo "Base contract: $BASE_REF"
          else
            : > "$BASE"
            echo "The base branch has no upstream/contract.json"
          fi
          # The commit that the base branch pins: when it is the commit of this
          # pull request, upstream did not change (empty when the base has none)
          BASE_COMMIT=$(git ls-tree FETCH_HEAD external/GlobalProtect-openconnect | awk '{print $3}')
          GATE="$RUNNER_TEMP/gate.py"
          if git show FETCH_HEAD:scripts/upstream_contract.py > "$GATE" 2>/dev/null; then
            echo "Gate script: $BASE_REF"
          else
            cp scripts/upstream_contract.py "$GATE"
            echo "The base branch has no scripts/upstream_contract.py: using the one of the pull request"
          fi
          python -I "$GATE" gate \
            --source external/GlobalProtect-openconnect \
            --verification upstream/verification.json \
            --base-contract "$BASE" \
            --base-commit "$BASE_COMMIT" \
            --labels "$LABELS"
