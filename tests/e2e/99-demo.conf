[main]
plugins=keyfile
# No polkit and no logind in the container: let the desktop user manage connections
auth-polkit=false

[keyfile]
# The router's end of the cable; it is moved to the router's namespace once the
# wired connection is up (NetworkManager does not manage a veth device whose
# peer is in another namespace, so the card has to be activated first)
unmanaged-devices=interface-name:ethpeer
